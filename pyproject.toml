[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farmsearch"
version = "0.1.0"
description = "Farmland acquisition screening pipeline for Frederick, Carroll, and SE Washington County, Maryland (Stages 1-4)."
requires-python = ">=3.10"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "pandas>=2.1",
  "numpy>=1.26",
  "rasterio>=1.3",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
farmsearch = "farmsearch.cli:main"

[tool.setuptools.packages.find]
include = ["farmsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
