# Washington County zoning codes -> is_agricultural.
#
# Codes were generated from the live county layer with
#     farmsearch zoning-domains --config config/pipeline.yaml --county Washington --write
# (https://services2.arcgis.com/uxxyl33jRTSmjre5/arcgis/rest/services/Washington_County_Zoning/FeatureServer/21, field Zone).
# is_agricultural was decided per code from the county zoning ordinance / official
# district descriptions (see `citation`), then independently re-checked. Rule:
# true for districts whose purpose is agriculture / rural or resource conservation
# where a 40+ acre working farm is the intended use; false for residential (any
# density), village, commercial, industrial, institutional, mixed-use, planned,
# mining, recreation, airport, overlay districts and non-district placeholders.
# Sources read:
#   https://www.washco-md.net/wp-content/uploads/legal-ZoningOrd.pdf
#   https://www.washco-md.net/document-repository/
#   https://www.washco-md.net/planning-zoning/
#   https://services2.arcgis.com/uxxyl33jRTSmjre5/arcgis/rest/services/Washington_County_Zoning/FeatureServer/21?f=pjson
# Stage 1 aborts (on_unmapped_zoning: error) if a code seen in the data is missing here.
code_field: Zone
