    is_agricultural: false
    confidence: high
    citation: Frederick County Code Ch. 1-19, §1-19-5.240(A),(C), https://frederickcountymd.gov/DocumentCenter/View/334390/Chapter-1-19-Zoning; GIS domain 'GC = General Commercial'
  GI:
