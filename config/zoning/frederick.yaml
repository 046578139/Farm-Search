# Frederick County zoning codes -> is_agricultural.
#
# Codes were generated from the live county layer with
#     farmsearch zoning-domains --config config/pipeline.yaml --county Frederick --write
# (https://fcgis.frederickcountymd.gov/server_pub/rest/services/PlanningAndPermitting/Zoning/MapServer/1, field TYPE).
# is_agricultural was decided per code from the county zoning ordinance / official
# district descriptions (see `citation`), then independently re-checked. Rule:
# true for districts whose purpose is agriculture / rural or resource conservation
# where a 40+ acre working farm is the intended use; false for residential (any
# density), village, commercial, industrial, institutional, mixed-use, planned,
# mining, recreation, airport, overlay districts and non-district placeholders.
# Sources read:
#   https://frederickcountymd.gov/DocumentCenter/View/334390/Chapter-1-19-Zoning
#   https://fcgis.frederickcountymd.gov/server_pub/rest/services/PlanningAndPermitting/Zoning/MapServer/1?f=pjson
# Stage 1 aborts (on_unmapped_zoning: error) if a code seen in the data is missing here.
code_field: TYPE
codes:
  A:
    description: Agricultural
    is_agricultural: true
    confidence: high
    citation: Frederick County Code Ch. 1-19, §1-19-5.220 and §1-19-7.300(A)-(B), https://frederickcountymd.gov/DocumentCenter/View/334390/Chapter-1-19-Zoning; GIS domain ZoneType 'A = Agricultural'
  RC:
    description: Resource Conservation
    is_agricultural: true
    confidence: high
    citation: Frederick County Code Ch. 1-19, §1-19-5.210 and §1-19-7.200, https://frederickcountymd.gov/DocumentCenter/View/334390/Chapter-1-19-Zoning; GIS domain 'RC = Resource Conservation'
  PUD:
    description: Planned Unit Development
    is_agricultural: false
    confidence: high
    citation: Frederick County Code Ch. 1-19, §1-19-10.500.1 Purpose and Intent, https://frederickcountymd.gov/DocumentCenter/View/334390/Chapter-1-19-Zoning; GIS domain 'PUD = Planned Unit Development'
