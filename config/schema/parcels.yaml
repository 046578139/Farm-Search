# Parcel layer field map: canonical name -> field name in the source data.
#
# THESE ARE PLACEHOLDERS drawn from the Maryland Parcel Boundaries / MdProperty
# View attribute conventions. They are NOT assumed correct: `farmsearch
# verify-schema` compares every entry against the live field list and Stage 1
# refuses to run until every required field resolves. Run
#     farmsearch verify-schema --config config/pipeline.yaml
# and edit this file to match what it prints.
#
# A canonical field may list several candidates; the first one present wins.

required:
  account_id: [ACCTID, ACCT_ID, ACCOUNT_ID]
  county_code: [JURSCODE, JURIS_CODE, COUNTY]
  owner_name: [OWNNAME1, OWNER_NAME, OWNNAME]
  # Mailing address pieces. Used for owner de-duplication and same-owner tests.
  owner_addr_line1: [OWNADD1, OWNER_ADDR1, OWNADDR1]
  owner_city: [OWNCITY, OWNER_CITY]
  owner_state: [OWNSTATE, OWNER_STATE]
  owner_zip: [OWNZIP, OWNER_ZIP]

optional:
  owner_name2: [OWNNAME2, OWNER_NAME2]
  owner_addr_line2: [OWNADD2, OWNER_ADDR2]
  acreage_sdat: [ACRES, LANDAREA, LAND_ACRES]
  land_use_code: [LU, LANDUSE, LAND_USE]
  zoning_sdat: [ZONING, ZONE]
  assessed_land_value: [NFMLNDVL, LANDVAL, LAND_VALUE]
  assessed_improvement_value: [NFMIMPVL, IMPVAL, IMPROVEMENT_VALUE]
  assessed_total_value: [NFMTTLVL, TOTALVAL, TOTAL_VALUE]
  situs_address: [ADDRESS, PREMSNUM, SITE_ADDRESS]
  map_page: [MAP]
  parcel_number: [PARCEL]
